name: Sonde des sources de données
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Valhalla alternates + péages
        run: |
          python3 - <<'PY'
          import urllib.request, json
          for opts in ({}, {"auto":{"use_tolls":0.0}}):
            body={"locations":[{"lat":43.1242,"lon":5.928},{"lat":45.764,"lon":4.8357}],"costing":"auto","costing_options":opts,"alternates":2,"directions_options":{"language":"fr-FR","units":"kilometers"}}
            req=urllib.request.Request("https://valhalla1.openstreetmap.de/route",data=json.dumps(body).encode(),headers={'User-Agent':'GPSPerso/0.1 probe','Content-Type':'application/json'})
            r=json.loads(urllib.request.urlopen(req,timeout=60).read())
            trips=[r['trip']]+[a['trip'] for a in r.get('alternates',[])]
            for t in trips:
              s=t['summary']; tolls=sum(1 for l in t['legs'] for m in l['maneuvers'] if m.get('toll'))
              print(opts, round(s['time']/60), 'min', round(s['length']), 'km', 'has_toll', s.get('has_toll'), 'toll maneuvers', tolls)
          PY
