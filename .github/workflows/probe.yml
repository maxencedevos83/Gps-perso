name: Sonde des sources de données
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Bison Futé DATEX II détails
        run: |
          curl -s -m 60 https://tipi.bison-fute.gouv.fr/bison-fute-ouvert/publicationsDIR/Evenementiel-DIR/grt/RRN/content.xml -o /tmp/bf.xml
          python3 - <<'PY'
          import re
          s=open('/tmp/bf.xml',encoding='utf-8').read()
          print('types', sorted(set(re.findall(r'situationRecord xsi:type="ns2:(\w+)"',s))))
          from collections import Counter
          print(Counter(re.findall(r'situationRecord xsi:type="ns2:(\w+)"',s)))
          sits=re.findall(r'<ns2:situation .*?</ns2:situation>',s,re.S)
          print('situations',len(sits))
          tags=Counter(re.findall(r'<ns2:(\w+)',s))
          print([t for t in tags if 'oord' in t or 'atitude' in t or 'ocation' in t or 'oint' in t or 'linear' in t.lower()])
          for x in sits[:1]+[y for y in sits if 'Accident' in y][:1]+[y for y in sits if 'MaintenanceWorks' in y][:1]:
            print('-----'); print(re.sub(r'\s+',' ',x)[:6000])
          print('cause types', Counter(re.findall(r'<ns2:(accidentType|roadMaintenanceType|obstructionType|abnormalTrafficType|roadOrCarriagewayOrLaneManagementType|environmentalObstructionType|poorEnvironmentType|vehicleObstructionType|generalObstructionType|equipmentOrSystemFaultType|disturbanceActivityType|nonWeatherRelatedRoadConditionType|weatherRelatedRoadConditionType)>(\w+)<',s)).most_common(40))
          PY
          curl -s -m 30 https://tipi.bison-fute.gouv.fr/bison-fute-ouvert/publicationsDIR/Evenementiel-DIR/cnir/ | grep -o 'href="[^"]*"' | head
