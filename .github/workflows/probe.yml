name: Sonde des sources de données
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Overpass limitations de vitesse
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, time, json
          servers=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://overpass.private.coffee/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter"]
          pts=[(43.135,5.93),(43.25,6.07),(48.85,2.35)]
          old='[out:json][timeout:10];way(around:1000,{lat},{lon})[highway~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|service|road)(_link)?$"];out tags geom;'
          new='[out:json][timeout:15];way(around:1500,{lat},{lon})[highway~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|road)(_link)?$"][~"^(maxspeed|maxspeed:forward|maxspeed:backward|zone:maxspeed)$"~"."];out tags geom qt;'
          for s in servers:
            for name,q in (('old',old),('new',new)):
              for lat,lon in pts[:2]:
                t=time.time()
                try:
                  req=urllib.request.Request(s,data=('data='+urllib.parse.quote(q.format(lat=lat,lon=lon))).encode(),headers={'User-Agent':'GPSPerso/0.1 probe'})
                  b=urllib.request.urlopen(req,timeout=30).read()
                  j=json.loads(b); print(s.split('/')[2],name,lat,'OK',round(time.time()-t,1),'s',len(b)//1024,'KB',len(j['elements']),'ways', sum(1 for e in j['elements'] if 'maxspeed' in e.get('tags',{})))
                except Exception as e:
                  print(s.split('/')[2],name,lat,'ERR',round(time.time()-t,1),'s',str(e)[:80])
          PY
