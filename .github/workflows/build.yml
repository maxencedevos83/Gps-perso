name: Compiler l'APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compiler
        run: ./gradlew assembleRelease --stacktrace
      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk gps-perso.apk
      - uses: actions/upload-artifact@v4
        with:
          name: gps-perso-apk
          path: gps-perso.apk
      - name: Publier la version
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GPS Perso n°${{ github.run_number }}
          body: APK à installer sur Android (remplace la version précédente).
          files: gps-perso.apk
          make_latest: true
