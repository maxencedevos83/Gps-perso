name: Compiler l'APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Aperçu de la réponse de l'API Lufop
        if: github.event_name != 'pull_request'
        env:
          LUFOP_KEY: ${{ secrets.LUFOP_KEY }}
        run: |
          if [ -n "$LUFOP_KEY" ]; then
            curl -s -m 60 "https://api.lufop.net/api?key=$LUFOP_KEY&format=json&nbr=3" | head -c 2000 || true
            echo
          else
            echo "Secret LUFOP_KEY absent"
          fi
      - name: Compiler
        env:
          LUFOP_KEY: ${{ secrets.LUFOP_KEY }}
          GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk gps-perso.apk
      - name: Publier la version
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GPS Perso n°${{ github.run_number }}
          body: APK à installer sur Android (remplace la version précédente).
          files: gps-perso.apk
          make_latest: true
